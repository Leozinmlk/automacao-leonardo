name: TEMP ROTAS v2.5.0 HANDOFF CLEANUP
on:
  push:
    branches: [rotas-v250-temp-handoff]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Remove temporary transport release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=rotas-v250-temp-transfer
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y
          fi
