name: TEMP ROTAS v2.5.0 HANDOFF
on:
  push:
    branches: [rotas-v250-temp-handoff]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Publish temporary transport release
        env:
          GH_TOKEN: ${{ github.token }}
          URL_B64: 
        run: |
          set -euo pipefail
          URL="$(printf '%s' "$URL_B64" | base64 -d)"
          APK=/tmp/ROTAS_Profit_Pilot_v2.5.0_FINAL.apk
          curl -fL --retry 3 --retry-delay 2 "$URL" -o "$APK"
          echo '8dcc49e095006f61bb9ce746cb2d0660944e19d03d05e7472f4447c811849b51  /tmp/ROTAS_Profit_Pilot_v2.5.0_FINAL.apk' | sha256sum -c -
          TAG=rotas-v250-temp-transfer
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y
          fi
          gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Temporary ROTA$ v2.5.0 transfer' --notes 'Temporary transport asset for direct ChatGPT handoff.'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets
