name: PUBLIC ROTA 2.5.1 FRIENDLY CHAT ARTIFACT
on:
  push:
    branches: [rotas-v251-temp-handoff]
    paths:
      - 'rotas-v251-public-trigger.txt'
permissions:
  contents: read
jobs:
  artifact:
    runs-on: ubuntu-24.04
    steps:
      - name: Download signed Friendly APK
        env:
          URL_B64: 
        run: |
          set -euo pipefail
          mkdir -p /tmp/apk
          URL="$(printf '%s' "$URL_B64" | base64 -d)"
          curl -fL --retry 3 --retry-delay 2 "$URL" -o /tmp/apk/ROTA_251_FRIENDLY.apk
          echo 'd3407cc7b0385932c8dbd572bdb5d7598c2ae1f94368e6f4c7cb77af7a72a8bc  /tmp/apk/ROTA_251_FRIENDLY.apk' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: ROTA-251-FRIENDLY-DIRECT
          path: /tmp/apk/ROTA_251_FRIENDLY.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
